services:
  - type: web
    name: brewlite-api
    env: docker
    rootDir: apps/api
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        value: brewlite_production_secret_key_change_me
      - key: PAYMENT_SIMULATION_MODE
        value: SUCCESS

  - type: web
    name: brewlite-web
    env: docker
    rootDir: apps/web
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://brewlite-api.onrender.com